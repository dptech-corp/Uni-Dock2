[build-system]
requires = [
    "scikit-build-core>=0.10",
    "pybind11",
]
build-backend = "scikit_build_core.build"

[project]
name = "unidock2"
description = "Uni-Dock molecular docking toolkit"
readme = "README.md"
authors = [
    {name = "DP Uni-Dock2 Team"},
]
license = {text = "Apache-2.0"}
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
]
dynamic = ["version"]

[project.scripts]
unidock2 = "unidock2.main:main"

[tool.scikit-build]
cmake.source-dir = "engine"
wheel.packages = ["unidock2"]

[tool.scikit-build.cmake.define]
BUILD_API = "ON"
BUILD_BIN = "OFF"
BUILD_TEST = "OFF"
BUILD_DOC = "OFF"

[tool.scikit-build.metadata.version]
provider = "scikit_build_core.metadata.regex"
input = "VERSION"
regex = '^\s*(?P<value>\S+)'

[tool.ruff]
include = [
    "unidock2/**/*.py",
    "tests/**/*.py",
]
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    ".vscode",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "site-packages",
    "venv",
]
line-length = 120
indent-width = 4
target-version = "py310"

[tool.ruff.lint]
select = ["E1", "E4", "E5", "E7", "E9", "F", "W"]
ignore = ["E722"]
fixable = ["ALL"]
unfixable = []
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = false
docstring-code-line-length = "dynamic"

[tool.pytest.ini_options]
pythonpath = "."
verbosity_assertions = 2
verbosity_test_cases = 2
addopts = "-s"
testpaths = [
    "tests",
]
