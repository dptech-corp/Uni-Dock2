name: Uni-Dock2 CI

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main

jobs:
  style-check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install CI tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install ruff tomli

      - name: Check dependency blocks are in sync
        run: python tools/sync_deps.py --check

      - name: Run ruff
        run: ruff check unidock2 tests

  engine-tests:
    runs-on: [nvidia, t4]
    env:
      CUDA_ARCH: 75
    container:
      image: dptechnology/unidock2:base-0.0.3
      options: --gpus all

    steps:
      - uses: actions/checkout@v4

      - name: Build and test the engine
        shell: bash
        run: |
          eval "$(micromamba shell hook --shell bash)"
          micromamba activate base
          python -m pip install pytest
          cmake -S engine -B build/engine-dev \
            -DBUILD_API=ON \
            -DBUILD_TEST=ON \
            -DBUILD_DOC=OFF \
            -DCMAKE_CUDA_ARCHITECTURES=$CUDA_ARCH
          cmake --build build/engine-dev
          ctest --test-dir build/engine-dev --output-on-failure

  package-tests:
    runs-on: [nvidia, t4]
    env:
      CUDA_ARCH: 75
      CMAKE_ARGS: -DCMAKE_CUDA_ARCHITECTURES=75
    container:
      image: dptechnology/unidock2:base-0.0.3
      options: --gpus all

    steps:
      - uses: actions/checkout@v4

      - name: Build and install the wheel
        shell: bash
        run: |
          eval "$(micromamba shell hook --shell bash)"
          micromamba activate base
          python -m pip install pytest
          python -m pip wheel . --no-deps -w dist/
          python -m pip install dist/unidock2-*.whl --no-deps

      - name: Check wheel contents
        shell: bash
        run: |
          eval "$(micromamba shell hook --shell bash)"
          micromamba activate base
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile

          wheel = next(Path("dist").glob("unidock2-*.whl"))
          with ZipFile(wheel) as archive:
              names = archive.namelist()

          forbidden = [
              name for name in names
              if "/test/" in name
              or "/tests/" in name
              or name.startswith("unidock_processing/")
              or name.startswith("unidock_engine/")
          ]
          if forbidden:
              raise SystemExit(f"Forbidden wheel contents: {forbidden}")
          PY

      - name: Verify the installed package
        shell: bash
        run: |
          eval "$(micromamba shell hook --shell bash)"
          micromamba activate base
          SITE_PACKAGES="$(python -c 'import site; print(site.getsitepackages()[0])')"
          pushd /tmp
          python -c "import unidock2"
          python -c "from unidock2._engine import pipeline"
          unidock2 --help
          unidock2 --version
          python -m pytest "$GITHUB_WORKSPACE/tests" -vv \
            --import-mode=importlib \
            -o "pythonpath=$SITE_PACKAGES $GITHUB_WORKSPACE"
          popd

  dependency-install-tests:
    runs-on: [nvidia, t4]
    env:
      CMAKE_ARGS: -DCMAKE_CUDA_ARCHITECTURES=75
    container:
      image: dptechnology/unidock2:base-0.0.3
      options: --gpus all

    steps:
      - uses: actions/checkout@v4

      - name: Install from package metadata in a clean environment
        shell: bash
        run: |
          eval "$(micromamba shell hook --shell bash)"
          micromamba create -y -n dependency-check \
            -c http://quetz.dp.tech:8088/get/baymax \
            -c conda-forge \
            python=3.10 pip \
            cuda-nvcc libcurand-dev cuda-cudart-dev cuda-version=12.0 \
            openmm pdbfixer msys_viparr_lpsolve55 ambertools_stable
          micromamba run -n dependency-check python -m pip install .
          micromamba run -n dependency-check python -m pip check

      - name: Verify the metadata-installed package
        shell: bash
        run: |
          pushd /tmp
          micromamba run -n dependency-check python -c "import unidock2"
          micromamba run -n dependency-check python -c "from unidock2._engine import pipeline"
          micromamba run -n dependency-check unidock2 --version
          popd
