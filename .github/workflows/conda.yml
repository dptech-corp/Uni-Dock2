name: Conda Build

on:
  push:
    tags:
      - "*"
  workflow_dispatch:
    inputs:
      build:
        description: 'Build number'
        required: true
        default: '1'

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: [ '3.10' ]
        cuda_compiler_version: [ '12.0', '13.0' ]
    env:
      QUETZ_API_KEY: ${{ secrets.QUETZ_API_KEY }}
      QUETZ_SERVER_URL: ${{ vars.QUETZ_SERVER_URL }}
      CONDA_CHANNEL: baymax
      BUILD: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.build || '1' }}
    steps:
      - uses: actions/checkout@v6

      - name: Read and validate version
        shell: bash
        run: |
          PACKAGE_VERSION="$(tr -d '[:space:]' < VERSION)"
          if [[ -z "$PACKAGE_VERSION" ]]; then
            echo "VERSION is empty"
            exit 1
          fi
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            if [[ "$GITHUB_REF_NAME" != v* ]]; then
              echo "Release tag must use the v<version> format"
              exit 1
            fi
            TAG_VERSION="${GITHUB_REF_NAME#v}"
            if [[ "$TAG_VERSION" != "$PACKAGE_VERSION" ]]; then
              echo "Tag version $TAG_VERSION does not match VERSION $PACKAGE_VERSION"
              exit 1
            fi
          fi
          echo "VERSION=$PACKAGE_VERSION" >> "$GITHUB_ENV"

      - name: Setup Miniconda and Mamba
        uses: conda-incubator/setup-miniconda@v4
        with:
          python-version: ${{ matrix.python }}
          auto-activate-base: false
          activate-environment: conda-build
          use-mamba: true
          mamba-version: "*"
          channels: conda-forge
      
      - name: Install dependencies
        shell: bash -l {0}
        run: |
          mamba install -y conda-build quetz-client -c conda-forge

      - name: Print version and build
        shell: bash -l {0}
        run: |
          echo "VERSION: ${{ env.VERSION }}"
          echo "BUILD: ${{ env.BUILD }}"

      - name: Build conda package
        shell: bash -l {0}
        run: |
          conda-build -c http://quetz.dp.tech:8088/get/baymax \
            -c conda-forge \
            --variants "{python: ['${{ matrix.python }}'], cuda_compiler_version: ['${{ matrix.cuda_compiler_version }}'], version: ['${VERSION}'], build: ['${{ env.BUILD }}']}" \
            --no-anaconda-upload \
            --output-folder conda-build \
            conda-recipe

      - name: Upload conda package
        shell: bash -l {0}
        run: |
          UNIDOCK_PACKAGE=$(find conda-build/ -type f \( -name 'unidock2-*.conda' -o -name 'unidock2-*.tar.bz2' \))
          quetz-client post_file_to_channel $CONDA_CHANNEL ${UNIDOCK_PACKAGE}
