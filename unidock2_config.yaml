# Uni-Dock2 default docking configuration.
# Replace null input paths before running docking.
# Run with: unidock2 docking -cf <this-file>
# Explicit command-line values override values in this file.

# Input structures and docking center.
Required:
  receptor: null  # Receptor structure file in PDB or DMS format
  ligand: null  # Single ligand structure file in SDF format
  ligand_batch: null  # Text file containing one ligand SDF file path per line
  center: [0.0, 0.0, 0.0]  # Docking box center coordinates [x, y, z] in angstroms

# Docking search and pose-output controls.
Advanced:
  exhaustiveness: 512  # Number of independent Monte Carlo runs (roughly proportional to runtime)
  randomize: true  # Randomize the input pose before global search
  mc_steps: 40  # Monte Carlo random-walk steps per run
  opt_steps: -1  # Optimization steps after each Monte Carlo step (-1 selects automatic)
  refine_steps: 5  # Local refinement steps after pose clustering
  num_pose: 10  # Maximum number of output poses per ligand
  rmsd_limit: 1.0  # RMSD threshold in angstroms for pose clustering
  energy_range: 5.0  # Energy window in kcal/mol for output poses
  seed: 1234567  # Random seed for reproducibility
  bias: 'no'  # Native bias mode: no, pos (position), or align
  bias_k: 0.1  # Scaling coefficient applied to native bias potentials
  use_tor_lib: false  # Use the torsion-angle library
  energy_decomp: false  # Output per-atom intermolecular energy decomposition

# CPU and GPU resource selection.
Hardware:
  n_cpu: null  # Maximum CPU workers for ligand preprocessing (null uses available CPUs)
  gpu_device_id: 0  # GPU device index to use
  max_gpu_memory: 0  # Maximum GPU memory in MB (0 uses the available-memory limit)

# Docking box and native engine mode settings.
Settings:
  box_size: [30.0, 30.0, 30.0]  # Docking box dimensions [x, y, z] in angstroms
  task: screen  # Native engine docking task type
  search_mode: balance  # Search mode: fast, balance, detail, or free; non-free modes select preset search parameters

# Topology preparation, constrained docking, temporary files, and outputs.
Preprocessing:
  construct_ff: false  # Construct force-field atom types and bonded parameters for ligands
  template_docking: false  # Enable template-constrained docking
  reference_sdf_file_name: null  # Reference ligand SDF file used by template-constrained docking
  compute_center: true  # Recompute the docking center from the reference or first ligand in constrained modes
  core_atom_mapping_dict_list: null  # Optional per-ligand core atom mappings for template-constrained docking
  covalent_ligand: false  # Enable covalent docking
  covalent_residue_atom_info_list: null  # Three receptor atom descriptors defining the covalent anchor and bond
  preserve_receptor_hydrogen: false  # Preserve receptor hydrogens during topology preparation
  temp_dir_name: /tmp  # Parent directory for temporary working directories
  engine_checkpoint: false  # Write legacy topology inputs and a replayable engine request
  output_receptor_dms_file_name: receptor_parameterized.dms  # Output receptor DMS file name
  output_docking_pose_sdf_file_name: unidock2_pose.sdf  # Output docking pose SDF file name
